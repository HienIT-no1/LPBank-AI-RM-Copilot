[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lpbank-ai-rm-copilot"
version = "0.1.0"
description = "AI Agent for Credit Card Spending Analysis & Next Best Offer Recommendation - LPBank Retail Banking"
authors = [{ name = "AI Engineering Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "pandas>=2.2.1",
    "openpyxl>=3.1.2",
    "openai>=1.14.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

